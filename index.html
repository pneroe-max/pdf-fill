    background:var(--sfondo);color:var(--testo);

    font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;

  .colonna{display:flex;flex-direction:column;height:100%}

  /* intestazione */

    display:flex;align-items:center;gap:12px;
    padding:12px 16px;background:var(--superficie);
    border-bottom:1px solid var(--bordo);flex:0 0 auto;
  }
  .testa h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .testa .sotto{display:block;font-size:12px;font-weight:400;color:var(--tenue);letter-spacing:0}
  .icona-btn{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:var(--superficie2);border:1px solid var(--bordo);font-size:18px;flex:0 0 auto;
  }
  .icona-btn:active{background:var(--bordo)}
  .icona-btn:disabled{opacity:.35}

  /* home */
  .corpo{flex:1;overflow-y:auto;padding:20px 16px 32px;-webkit-overflow-scrolling:touch}
  .titolone{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.03em;margin:8px 0 6px}
  .sommario{color:var(--tenue);margin:0 0 24px;max-width:34em}
  .azione{
    display:block;width:100%;padding:16px;border-radius:14px;
    background:var(--evidenziatore);color:#1a1200;font-weight:700;text-align:center;
    box-shadow:0 6px 18px rgba(255,210,63,.18);
  }
  .azione:active{transform:translateY(1px)}
  .azione[disabled]{opacity:.5;box-shadow:none}
  .voce{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:14px 16px;border-radius:14px;background:var(--superficie);
    border:1px solid var(--bordo);margin-top:10px;
  }
  .voce:active{background:var(--superficie2)}
  .voce .eti{flex:1}
  .voce .eti b{display:block;font-weight:600}
  .voce .eti span{font-size:13px;color:var(--tenue)}
  .voce .freccia{color:var(--tenue)}
  .gruppo{margin-top:28px}
  .gruppo h2{font-size:14px;font-weight:600;color:var(--tenue);margin:0 0 8px}

  /* editor */
  .scena{flex:1;overflow:auto;background:#0e151d;position:relative;touch-action:pan-x pan-y}
  .foglio{position:relative;margin:14px auto;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#fff;width:max-content}
  .foglio canvas{display:block}
  .campo{
    position:absolute;border-radius:3px;cursor:pointer;
    display:flex;align-items:center;overflow:hidden;

  }
  .campo.vuoto{background:rgba(255,210,63,.32);border-color:rgba(255,210,63,.85)}
  .campo.pieno{background:rgba(77,155,255,.14);border-color:rgba(77,155,255,.7)}
  .campo.firmato{background:rgba(139,124,246,.14);border-color:rgba(139,124,246,.75)}
  .campo.scelto{outline:2px solid var(--penna);outline-offset:1px}
  .campo .val{
    color:#10243d;font-family:Helvetica,Arial,sans-serif;white-space:nowrap;
    padding:0 2px;pointer-events:none;
  }
  .campo img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .campo .maniglia{
    position:absolute;right:-9px;top:50%;transform:translateY(-50%);
    width:18px;height:26px;border-radius:5px;background:var(--penna);opacity:.9;
  }
  .campo .spunta{color:#10243d;font-weight:700;width:100%;text-align:center;pointer-events:none}
  .piedi{
    display:flex;align-items:center;gap:10px;padding:10px 14px;

  .piedi .conta{font-size:13px;color:var(--tenue);flex:1;text-align:center}
  .piedi .salva{padding:12px 18px;border-radius:12px;background:var(--evidenziatore);color:#1a1200;font-weight:700}

  /* foglio inferiore */

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}

  .chip.attivo{background:var(--penna);border-color:var(--penna);color:#04131f;font-weight:600}
  .righe{display:flex;gap:10px;margin-top:16px}

  .btn{padding:13px;border-radius:12px;background:var(--superficie2);border:1px solid var(--bordo);text-align:center;font-weight:600}

  /* firme */
  .tela{width:100%;height:210px;background:#fff;border-radius:14px;touch-action:none;display:block}
  .anteprima{background:#fff;border-radius:12px;padding:8px;height:88px;display:grid;place-items:center}
  .anteprima img{max-width:100%;max-height:100%}
  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .scheda{background:var(--superficie);border:1px solid var(--bordo);border-radius:14px;padding:10px}
  .scheda.predef{border-color:var(--evidenziatore)}
  .scheda .riga{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--tenue)}
  .scheda .riga button{padding:6px 8px;border-radius:8px;background:var(--superficie2);font-size:12px}

  .etichetta{display:block;font-size:13px;color:var(--tenue);margin:14px 0 6px}
  .avviso{
    background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);
    color:#ffc9c9;padding:12px 14px;border-radius:12px;margin-top:14px;font-size:14px;

  .toast{
    position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));

  .carico{display:grid;place-items:center;height:100%;color:var(--tenue);gap:12px;text-align:center;padding:24px}
  .barra{width:120px;height:4px;border-radius:2px;background:var(--bordo);overflow:hidden}
  .barra i{display:block;height:100%;width:40%;background:var(--evidenziatore);animation:scorre 1.1s infinite}
  @keyframes scorre{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

<body>
<div id="root"><div class="carico"><div class="barra"><i></i></div><div>Avvio</div></div></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useCallback} = React;
const PL = window.PDFLib;
const {PDFDocument, StandardFonts, rgb} = PL;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ============================ archivio (IndexedDB) ============================ */

const DB_NOME = "pdffill";
const DB_VER = 1;
let dbCache = null;

function apriDB() {
  if (dbCache) return Promise.resolve(dbCache);
  return new Promise((ok, ko) => {
    const r = indexedDB.open(DB_NOME, DB_VER);
    r.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("firme")) d.createObjectStore("firme", {keyPath: "id"});
      if (!d.objectStoreNames.contains("anagrafica")) d.createObjectStore("anagrafica", {keyPath: "chiave"});
      if (!d.objectStoreNames.contains("layout")) d.createObjectStore("layout", {keyPath: "impronta"});
    };
    r.onsuccess = () => { dbCache = r.result; ok(dbCache); };
    r.onerror = () => ko(r.error);
  });
}
function trans(store, modo) {
  return apriDB().then((d) => d.transaction(store, modo).objectStore(store));
}
function idbTutti(store) {
  return trans(store, "readonly").then((s) => new Promise((ok, ko) => {
    const r = s.getAll(); r.onsuccess = () => ok(r.result || []); r.onerror = () => ko(r.error);
  }));
}
function idbLeggi(store, chiave) {
  return trans(store, "readonly").then((s) => new Promise((ok, ko) => {
    const r = s.get(chiave); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error);
  }));
}
function idbSalva(store, valore) {
  return trans(store, "readwrite").then((s) => new Promise((ok, ko) => {
    const r = s.put(valore); r.onsuccess = () => ok(true); r.onerror = () => ko(r.error);
  }));
}
function idbElimina(store, chiave) {
  return trans(store, "readwrite").then((s) => new Promise((ok, ko) => {
    const r = s.delete(chiave); r.onsuccess = () => ok(true); r.onerror = () => ko(r.error);
  }));
}

/* ============================ anagrafica ============================ */

const CAMPI_ANAGRAFICA = [
  {chiave: "nome_cognome", etichetta: "Nome e cognome"},
  {chiave: "nome", etichetta: "Nome"},
  {chiave: "cognome", etichetta: "Cognome"},
  {chiave: "cf", etichetta: "Codice fiscale"},
  {chiave: "data_nascita", etichetta: "Data di nascita"},
  {chiave: "luogo_nascita", etichetta: "Luogo di nascita"},
  {chiave: "indirizzo", etichetta: "Indirizzo"},
  {chiave: "cap", etichetta: "CAP"},
  {chiave: "citta", etichetta: "Città"},
  {chiave: "provincia", etichetta: "Provincia"},
  {chiave: "telefono", etichetta: "Telefono"},
  {chiave: "email", etichetta: "Email"},
  {chiave: "documento", etichetta: "Documento"},
  {chiave: "azienda", etichetta: "Azienda"},
  {chiave: "luogo_firma", etichetta: "Luogo di firma"},
  {chiave: "data_oggi", etichetta: "Data di oggi", auto: true},
];

// ordine: le regole più specifiche per prime
const REGOLE = [
  ["nome_cognome", /(nome\s*e\s*cognome|cognome\s*e\s*nome|nominativo|intestatar|richiedent|sottoscritt)/],
  ["cf", /(codice\s*fiscale|cod\.?\s*fisc|\bc\.?\s*f\.?\b|fiscal)/],
  ["data_nascita", /(data\s*(di\s*)?nascita|nato\s*il|nata\s*il|birth\s*date|\bdob\b)/],
  ["luogo_nascita", /(luogo\s*(di\s*)?nascita|nato\s*a|nata\s*a|comune\s*di\s*nascita|birthplace)/],
  ["cognome", /(cognome|surname|lastname|last_name|family)/],
  ["nome", /(\bnome\b|firstname|first_name|givenname|\bname\b)/],
  ["cap", /(\bcap\b|c\.a\.p|\bzip\b|postal)/],
  ["provincia", /(provincia|\bprov\b|\bpr\b)/],
  ["citta", /(citt|comune|localit|\bcity\b)/],
  ["indirizzo", /(indirizzo|\bvia\b|residen|address|domicil)/],
  ["telefono", /(telefono|\btel\b|cell|phone|mobile|recapito)/],
  ["email", /(e-?mail|posta\s*elettronica|\bpec\b)/],
  ["documento", /(carta\s*d.?identit|documento|patente|passaporto)/],
  ["azienda", /(azienda|societ|ragione\s*sociale|ditta|impresa|company)/],
  ["luogo_firma", /(luogo\s*e\s*data)/],
  ["data_oggi", /(\bdata\b|\bdate\b|\bl[iì]\b)/],
];

function indovinaChiave(nomeCampo) {
  const n = (nomeCampo || "").toLowerCase().replace(/[_\-.]+/g, " ");
  for (const [chiave, re] of REGOLE) if (re.test(n)) return chiave;
  return null;
}

function dataOggi() {
  const d = new Date();
  const z = (v) => String(v).padStart(2, "0");
  return z(d.getDate()) + "/" + z(d.getMonth() + 1) + "/" + d.getFullYear();
}

function valoreAnagrafica(ana, chiave) {
  if (!chiave) return "";
  if (chiave === "data_oggi") return ana.data_oggi || dataOggi();
  return ana[chiave] || "";
}

/* ============================ utilità ============================ */

// Helvetica standard = WinAnsi: tolgo ciò che non è codificabile
const SOSTITUZIONI = [
  [/[\u2018\u2019\u201B]/g, "'"], [/[\u201C\u201D]/g, '"'],
  [/[\u2013\u2014]/g, "-"], [/\u2026/g, "..."], [/\u00a0/g, " "],
];
function sicuro(t) {
  let s = String(t == null ? "" : t);
  for (const [re, v] of SOSTITUZIONI) s = s.replace(re, v);
  return s.replace(/[^\x20-\x7E\u00A1-\u00FF\u20AC]/g, "");
}

function fnv(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}

let contatore = 0;
const nuovoId = () => "c" + (++contatore) + "_" + Date.now().toString(36);

// corpo massimo che entra nel rettangolo, minimo 6pt
function corpoAdatto(testo, larghezza, altezza, font, max) {
  const t = sicuro(testo);
  if (!t) return 10;
  let s = Math.round(Math.min(max || 12, Math.max(6, altezza * 0.72)) * 4) / 4;
  while (s > 6 && font.widthOfTextAtSize(t, s) > larghezza - 3) s -= 0.25;
  return Math.max(6, Math.round(s * 4) / 4);
}

function normalizzaRect(r) {
  let {x, y, width, height} = r;
  if (width < 0) { x += width; width = -width; }
  if (height < 0) { y += height; height = -height; }
  return {x, y, w: width, h: height};
}

const is = (o, C) => !!C && o instanceof C;

/* ============================ lettura campi AcroForm ============================ */

function leggiAcro(libDoc) {
  let form, campi = [];
  try { form = libDoc.getForm(); } catch (e) { return campi; }
  let lista;
  try { lista = form.getFields(); } catch (e) { return campi; }

  const pagine = libDoc.getPages();
  const mappa = new Map();
  pagine.forEach((p, i) => {
    let annots = null;
    try { annots = p.node.Annots(); } catch (e) { annots = null; }
    if (!annots) return;
    for (let j = 0; j < annots.size(); j++) {
      try { const d = libDoc.context.lookup(annots.get(j)); if (d) mappa.set(d, i); } catch (e) {}
    }
  });

  lista.forEach((f) => {
    let tipo = null, opzioni = null;
    if (is(f, PL.PDFTextField)) tipo = "testo";
    else if (is(f, PL.PDFCheckBox)) tipo = "check";
    else if (is(f, PL.PDFSignature)) tipo = "firma";
    else if (is(f, PL.PDFDropdown) || is(f, PL.PDFRadioGroup) || is(f, PL.PDFOptionList)) {
      tipo = "scelta";
      try { opzioni = f.getOptions(); } catch (e) { opzioni = []; }
    }
    if (!tipo) return;

    const nome = f.getName();
    let precompilato = "";
    try { if (tipo === "testo") precompilato = f.getText() || ""; } catch (e) {}
    let spuntato = false;
    try { if (tipo === "check") spuntato = f.isChecked(); } catch (e) {}

    let widgets = [];
    try { widgets = f.acroField.getWidgets(); } catch (e) { widgets = []; }
    widgets.forEach((wid, k) => {
      let r;
      try { r = normalizzaRect(wid.getRectangle()); } catch (e) { return; }
      if (!r || r.w < 4 || r.h < 4) return;
      let pagina = 0;
      try { const p = mappa.get(wid.dict); if (typeof p === "number") pagina = p; } catch (e) {}
      campi.push({
        id: nuovoId(), pagina, x: r.x, y: r.y, w: r.w, h: r.h,
        tipo, nome, acro: true, indice: k, opzioni,
        valore: tipo === "check" ? spuntato : precompilato,
        chiave: indovinaChiave(nome), firmaId: null,
      });
    });
  });
  return campi;
}

/* ============================ rilevamento su PDF piatto ============================ */

function rilevaCampi(ctx, W, H, scala, altPag) {
  const dati = ctx.getImageData(0, 0, W, H).data;
  const scuro = new Uint8Array(W * H);
  for (let i = 0, p = 0; p < W * H; i += 4, p++) {
    scuro[p] = (dati[i] * 0.299 + dati[i + 1] * 0.587 + dati[i + 2] * 0.114) < 145 ? 1 : 0;
  }

  const minLen = Math.round(45 * scala);      // 45pt
  const maxSpessore = Math.max(3, Math.round(2.5 * scala));
  const grezze = [];

  for (let y = maxSpessore + 1; y < H - maxSpessore - 1; y++) {
    let x = 0;
    const base = y * W;
    while (x < W) {
      if (!scuro[base + x]) { x++; continue; }
      const inizio = x;
      while (x < W && scuro[base + x]) x++;
      const len = x - inizio;
      if (len < minLen) continue;
      // deve essere sottile: la riga sopra (a distanza maxSpessore+1) dev'essere chiara
      const sopra = base - (maxSpessore + 1) * W;
      let pieni = 0, letti = 0;
      for (let i = inizio; i < x; i += 3) { letti++; if (scuro[sopra + i]) pieni++; }
      if (letti && pieni / letti > 0.35) continue;
      grezze.push({y, x0: inizio, x1: x, len});
    }
  }

  // fondo le righe contigue che appartengono alla stessa linea
  grezze.sort((a, b) => a.y - b.y || a.x0 - b.x0);
  const linee = [];
  grezze.forEach((g) => {
    const simile = linee.find((l) =>
      Math.abs(l.y - g.y) <= maxSpessore + 2 &&
      Math.min(l.x1, g.x1) - Math.max(l.x0, g.x0) > 0.6 * Math.min(l.len, g.len));
    if (simile) {
      simile.x0 = Math.min(simile.x0, g.x0);
      simile.x1 = Math.max(simile.x1, g.x1);
      simile.len = simile.x1 - simile.x0;
    } else linee.push({...g});
  });

  // caselle quadrate: lato realistico, forma quadra, interno vuoto (le lettere no)
  const caselle = [];
  const qMin = Math.round(8.5 * scala), qMax = Math.round(18 * scala);
  for (let y = 1; y < H - qMax - 2 && caselle.length < 20; y++) {
    let x = 0;
    const base = y * W;
    while (x < W) {
      if (!scuro[base + x]) { x++; continue; }
      const inizio = x;
      while (x < W && scuro[base + x]) x++;
      const len = x - inizio;
      if (len < qMin || len > qMax) continue;
      if (caselle.some((c) => Math.abs(c.x0 - inizio) < len && Math.abs(c.y0 - y) < len)) continue;
      const lato = len;
      let trovata = false;
      for (let d = Math.round(lato * 0.82); d <= Math.round(lato * 1.22) && !trovata; d++) {
        const yb = y + d;
        if (yb >= H) break;
        let coperti = 0;
        for (let i = inizio; i < x; i++) if (scuro[yb * W + i]) coperti++;
        if (coperti < len * 0.8) continue;
        let sx = 0, dx = 0;
        for (let yy = y; yy <= yb; yy++) {
          if (scuro[yy * W + inizio]) sx++;
          if (scuro[yy * W + x - 1]) dx++;
        }
        if (sx < d * 0.75 || dx < d * 0.75) continue;
        // l'interno di una casella è vuoto, quello di una lettera no
        const bx = Math.max(2, Math.round(len * 0.28)), by = Math.max(2, Math.round(d * 0.28));
        let dentro = 0, letti = 0;
        for (let yy = y + by; yy <= yb - by; yy++) {
          for (let xx = inizio + bx; xx < x - bx; xx++) { letti++; if (scuro[yy * W + xx]) dentro++; }
        }
        if (letti && dentro / letti > 0.2) continue;
        caselle.push({x0: inizio, y0: y, lato: len, altezza: d});
        trovata = true;
      }
    }
  }

  const campi = [];
  linee.slice(0, 60).forEach((l) => {
    const larg = (l.x1 - l.x0) / scala;
    campi.push({
      id: nuovoId(), pagina: -1,
      x: l.x0 / scala + 1.5,
      y: altPag - l.y / scala + 2,
      w: larg - 3, h: 13,
      tipo: "testo", nome: "", acro: false, valore: "", chiave: null, firmaId: null,
    });
  });
  caselle.forEach((c) => {
    campi.push({
      id: nuovoId(), pagina: -1,
      x: c.x0 / scala, y: altPag - (c.y0 + c.altezza) / scala,
      w: c.lato / scala, h: c.altezza / scala,
      tipo: "check", nome: "", acro: false, valore: false, chiave: null, firmaId: null,
    });
  });
  return campi;
}

/* ============================ schermata: pagina PDF ============================ */

function Pagina({jsDoc, numero, campi, scelto, onScegli, onSposta, onNuovo, modoAgg, firme, onPronta}) {
  const tela = useRef(null);
  const foglio = useRef(null);
  const [vista, setVista] = useState(null);
  const trasc = useRef(null);

  useEffect(() => {
    let annullato = false;
    (async () => {
      const pag = await jsDoc.getPage(numero + 1);
      const v1 = pag.getViewport({scale: 1});
      const disponibile = Math.min(window.innerWidth - 20, 900);
      const scalaCss = disponibile / v1.width;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const vp = pag.getViewport({scale: scalaCss * dpr});
      const c = tela.current;
      if (!c || annullato) return;
      c.width = Math.floor(vp.width);
      c.height = Math.floor(vp.height);
      c.style.width = Math.floor(v1.width * scalaCss) + "px";
      c.style.height = Math.floor(v1.height * scalaCss) + "px";
      const ctx = c.getContext("2d", {willReadFrequently: true});
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      await pag.render({canvasContext: ctx, viewport: vp}).promise;
      if (annullato) return;
      setVista({scalaCss, larghezza: v1.width, altezza: v1.height});
      onPronta(numero, ctx, c.width, c.height, scalaCss * dpr, v1.height);
    })();
    return () => { annullato = true; };
  }, [jsDoc, numero]);

  const s = vista ? vista.scalaCss : 1;
  const H = vista ? vista.altezza : 0;

  const puntoLocale = (cx, cy) => {
    const r = foglio.current.getBoundingClientRect();
    return {x: (cx - r.left) / s, y: H - (cy - r.top) / s};
  };

  const giuSuCampo = (e, campo, maniglia) => {
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    const p = puntoLocale(e.clientX, e.clientY);
    trasc.current = {id: campo.id, maniglia, px: p.x, py: p.y, x: campo.x, y: campo.y, w: campo.w, mosso: false};
  };
  const muoviSuCampo = (e) => {
    const t = trasc.current;
    if (!t) return;
    const p = puntoLocale(e.clientX, e.clientY);
    const dx = p.x - t.px, dy = p.y - t.py;
    if (!t.mosso && Math.abs(dx) * s < 6 && Math.abs(dy) * s < 6) return;
    t.mosso = true;
    if (t.maniglia) onSposta(t.id, {w: Math.max(14, t.w + dx)});
    else onSposta(t.id, {x: t.x + dx, y: t.y + dy});
  };
  const suSuCampo = (e, campo) => {
    const t = trasc.current;
    trasc.current = null;
    if (t && !t.mosso) onScegli(campo.id);
  };

  return (
    <div ref={foglio} className={"foglio" + (modoAgg ? " modo-agg" : "")}
         onClick={(e) => { if (modoAgg && vista) { const p = puntoLocale(e.clientX, e.clientY); onNuovo(p.x, p.y); } }}>
      <canvas ref={tela}></canvas>
      {vista && campi.map((c) => {
        const stato = c.tipo === "firma" || c.firmaId ? (c.firmaId ? "firmato" : "vuoto")
          : (c.tipo === "check" ? (c.valore ? "pieno" : "vuoto") : (c.valore ? "pieno" : "vuoto"));
        const firma = c.firmaId ? firme.find((f) => f.id === c.firmaId) : null;
        return (
          <div key={c.id}
               className={"campo " + stato + (scelto === c.id ? " scelto" : "")}
               style={{
                 left: c.x * s, top: (H - c.y - c.h) * s,
                 width: Math.max(10, c.w * s), height: Math.max(10, c.h * s),
               }}
               onClick={(e) => e.stopPropagation()}
               onPointerDown={(e) => giuSuCampo(e, c, false)}
               onPointerMove={muoviSuCampo}
               onPointerUp={(e) => suSuCampo(e, c)}>
            {firma && <img src={firma.png} alt="" />}
            {!firma && c.tipo === "check" && c.valore && <span className="spunta">✕</span>}
            {!firma && c.tipo !== "check" && !!c.valore &&
              <span className="val" style={{fontSize: Math.max(7, Math.min(c.h * 0.72, 12) * s)}}>{c.valore}</span>}
            {scelto === c.id && <span className="maniglia"
              onPointerDown={(e) => giuSuCampo(e, c, true)}
              onPointerMove={muoviSuCampo}
              onPointerUp={(e) => suSuCampo(e, c)}></span>}
          </div>
        );
      })}
    </div>
  );
}

/* ============================ foglio di modifica campo ============================ */

function FoglioCampo({campo, anagrafica, firme, onChiudi, onAggiorna, onElimina}) {
  const [testo, setTesto] = useState(campo.tipo === "check" ? "" : String(campo.valore || ""));
  useEffect(() => { setTesto(campo.tipo === "check" ? "" : String(campo.valore || "")); }, [campo.id]);

  const conferma = () => { onAggiorna(campo.id, {valore: testo}); onChiudi(); };
  const usaChiave = (chiave) => {
    const v = valoreAnagrafica(anagrafica, chiave);
    setTesto(v);
    onAggiorna(campo.id, {chiave, valore: v});
  };
  const usaFirma = (id) => { onAggiorna(campo.id, {firmaId: id, tipo: "firma"}); onChiudi(); };

  const titolo = campo.tipo === "check" ? "Casella" : campo.tipo === "firma" ? "Firma"
    : campo.tipo === "scelta" ? "Scelta" : "Testo";

  return (
    <>
      <div className="velo" onClick={onChiudi}></div>
      <div className="sheet">
        <h3>{titolo}</h3>
        <p className="nomecampo">{campo.nome || "campo rilevato"}{campo.acro ? " · modulo" : " · aggiunto"}</p>

        {campo.tipo === "check" && (
          <div className="righe">
            <button className={"btn" + (campo.valore ? " primario" : "")}
              onClick={() => { onAggiorna(campo.id, {valore: true}); onChiudi(); }}>Spunta</button>
            <button className={"btn" + (!campo.valore ? " primario" : "")}
              onClick={() => { onAggiorna(campo.id, {valore: false}); onChiudi(); }}>Vuota</button>
          </div>
        )}

        {campo.tipo === "scelta" && (
          <div className="chips">
            {(campo.opzioni || []).map((o) => (
              <button key={o} className={"chip" + (campo.valore === o ? " attivo" : "")}
                onClick={() => { onAggiorna(campo.id, {valore: o}); onChiudi(); }}>{o}</button>
            ))}
          </div>
        )}

        {(campo.tipo === "testo" || campo.tipo === "firma") && (
          <>
            {campo.tipo === "testo" && (
              <>
                <input className="campo-testo" value={testo} autoFocus
                  onChange={(e) => setTesto(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") conferma(); }}
                  placeholder="Scrivi qui" />
                <span className="etichetta">Dati salvati</span>
                <div className="chips">
                  {CAMPI_ANAGRAFICA.filter((c) => c.auto || anagrafica[c.chiave]).map((c) => (
                    <button key={c.chiave} className={"chip" + (campo.chiave === c.chiave ? " attivo" : "")}
                      onClick={() => usaChiave(c.chiave)}>{c.etichetta}</button>
                  ))}
                </div>
              </>
            )}
            {firme.length > 0 && (
              <>
                <span className="etichetta">Firme</span>
                <div className="chips">
                  {firme.map((f) => (
                    <button key={f.id} className={"chip" + (campo.firmaId === f.id ? " attivo" : "")}
                      onClick={() => usaFirma(f.id)}>{f.nome}</button>
                  ))}
                  {campo.firmaId && <button className="chip" onClick={() => onAggiorna(campo.id, {firmaId: null})}>Togli</button>}
                </div>
              </>
            )}
          </>
        )}

        <div className="righe">
          <button className="btn rosso" onClick={() => { onElimina(campo.id); onChiudi(); }}>Elimina campo</button>
          <button className="btn primario" onClick={conferma}>Fatto</button>
        </div>
      </div>
    </>
  );
}

/* ============================ editor ============================ */

function Editor({file, anagrafica, firme, onEsci, toast}) {
  const [stato, setStato] = useState("carico");
  const [campi, setCampi] = useState([]);
  const [pagina, setPagina] = useState(0);
  const [nPagine, setNPagine] = useState(1);
  const [scelto, setScelto] = useState(null);
  const [modoAgg, setModoAgg] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const bytes = useRef(null);
  const jsDoc = useRef(null);
  const impronta = useRef("");
  const rilevate = useRef(new Set());
  const daLayout = useRef(false);
  const altezze = useRef({});

  useEffect(() => {
    let vivo = true;
    (async () => {
      try {
        const buf = await file.arrayBuffer();
        bytes.current = new Uint8Array(buf.slice(0));
        const doc = await pdfjsLib.getDocument({data: new Uint8Array(buf.slice(0))}).promise;
        if (!vivo) return;
        jsDoc.current = doc;
        setNPagine(doc.numPages);

        const p1 = await doc.getPage(1);
        const tc = await p1.getTextContent();
        const testo = tc.items.map((i) => i.str).join("").replace(/\s+/g, "").slice(0, 1500);
        impronta.current = fnv(testo.length > 20
          ? testo + "|" + doc.numPages
          : file.name + "|" + file.size);

        const salvato = await idbLeggi("layout", impronta.current);
        let lista;
        if (salvato && salvato.campi && salvato.campi.length) {
          daLayout.current = true;
          lista = salvato.campi.map((c) => ({...c, id: nuovoId(), valore: c.tipo === "check" ? false : "", firmaId: null}));
        } else {
          const libDoc = await PDFDocument.load(bytes.current.slice(0), {ignoreEncryption: true});
          lista = leggiAcro(libDoc);
        }
        // precompilo dall'anagrafica
        lista = lista.map((c) => {
          if (c.tipo === "testo" && c.chiave && !c.valore) {
            const v = valoreAnagrafica(anagrafica, c.chiave);
            if (v) return {...c, valore: v};
          }
          return c;
        });
        if (!vivo) return;
        setCampi(lista);
        setStato("pronto");
      } catch (e) {
        console.error(e);
        if (vivo) setStato("errore");
      }
    })();
    return () => { vivo = false; };
  }, [file]);

  const paginaPronta = useCallback((num, ctx, W, H, scala, altPag) => {
    altezze.current[num] = altPag;
    if (daLayout.current || rilevate.current.has(num)) return;
    rilevate.current.add(num);
    setCampi((prec) => {
      if (prec.some((c) => c.pagina === num)) return prec;
      let trovati = [];
      try { trovati = rilevaCampi(ctx, W, H, scala, altPag); } catch (e) { console.error(e); }
      if (!trovati.length) return prec;
      return prec.concat(trovati.map((c) => ({...c, pagina: num})));
    });
  }, []);

  const aggiorna = (id, patch) => setCampi((p) => p.map((c) => (c.id === id ? {...c, ...patch} : c)));
  const elimina = (id) => setCampi((p) => p.filter((c) => c.id !== id));
  const nuovoCampo = (x, y) => {
    const c = {id: nuovoId(), pagina, x: x - 60, y: y - 6, w: 120, h: 13,
      tipo: "testo", nome: "", acro: false, valore: "", chiave: null, firmaId: null};
    setCampi((p) => p.concat(c));
    setModoAgg(false);
    setScelto(c.id);
  };

  async function salva() {
    setSalvando(true);
    try {
      const doc = await PDFDocument.load(bytes.current.slice(0), {ignoreEncryption: true});
      const helv = await doc.embedFont(StandardFonts.Helvetica);
      const pagine = doc.getPages();
      let form = null;
      try { form = doc.getForm(); } catch (e) { form = null; }

      // 1. campi del modulo
      if (form) {
        campi.filter((c) => c.acro && !c.firmaId).forEach((c) => {
          try {
            const f = form.getField(c.nome);
            if (c.tipo === "testo" && String(c.valore || "")) {
              const t = sicuro(c.valore);
              f.setText(t);
              f.setFontSize(corpoAdatto(t, c.w, c.h, helv, 12));
            } else if (c.tipo === "check") {
              c.valore ? f.check() : f.uncheck();
            } else if (c.tipo === "scelta" && c.valore) {
              f.select(c.valore);
            }
          } catch (e) { console.warn("campo", c.nome, e); }
        });
      }

      let appiattito = true;
      if (form) { try { form.flatten(); } catch (e) { appiattito = false; console.warn(e); } }

      // 2. testo dei campi rilevati/aggiunti
      const cacheFirme = {};
      for (const c of campi) {
        const pag = pagine[c.pagina];
        if (!pag) continue;

        if (c.firmaId) {
          const f = firme.find((x) => x.id === c.firmaId);
          if (!f) continue;
          if (!cacheFirme[c.firmaId]) cacheFirme[c.firmaId] = await doc.embedPng(f.png);
          const img = cacheFirme[c.firmaId];
          const k = Math.min(c.w / img.width, (c.h * 2.4) / img.height);
          const lw = img.width * k, lh = img.height * k;
          pag.drawImage(img, {x: c.x + (c.w - lw) / 2, y: c.y - lh * 0.15, width: lw, height: lh});
          continue;
        }
        if (c.acro) continue; // già scritti come campi modulo

        if (c.tipo === "check") {
          if (!c.valore) continue;
          const m = Math.min(c.w, c.h) * 0.22;
          const o = {thickness: 1.2, color: rgb(0.06, 0.14, 0.24)};
          pag.drawLine({start: {x: c.x + m, y: c.y + m}, end: {x: c.x + c.w - m, y: c.y + c.h - m}, ...o});
          pag.drawLine({start: {x: c.x + m, y: c.y + c.h - m}, end: {x: c.x + c.w - m, y: c.y + m}, ...o});
          continue;
        }
        const t = sicuro(c.valore);
        if (!t) continue;
        const corpo = corpoAdatto(t, c.w, c.h, helv, 12);
        const base = c.y + Math.max(1.5, (c.h - corpo) * 0.4);
        pag.drawText(t, {x: c.x + 1.5, y: base, size: corpo, font: helv, color: rgb(0.06, 0.14, 0.24)});
      }

      const out = await doc.save();
      const nome = file.name.replace(/\.pdf$/i, "") + "_compilato.pdf";
      const blob = new Blob([out], {type: "application/pdf"});

      // 3. memorizzo posizioni e associazioni, non i valori
      try {
        await idbSalva("layout", {
          impronta: impronta.current, nome: file.name, aggiornato: Date.now(),
          campi: campi.map((c) => ({
            pagina: c.pagina, x: c.x, y: c.y, w: c.w, h: c.h, tipo: c.tipo,
            nome: c.nome, acro: c.acro, opzioni: c.opzioni || null, chiave: c.chiave || null,
          })),
        });
      } catch (e) { console.warn(e); }

      const fileOut = new File([blob], nome, {type: "application/pdf"});
      if (navigator.canShare && navigator.canShare({files: [fileOut]})) {
        try { await navigator.share({files: [fileOut], title: nome}); }
        catch (e) { if (e.name !== "AbortError") scarica(blob, nome); }
      } else scarica(blob, nome);

      toast(appiattito ? "PDF compilato" : "Salvato, ma i campi del modulo restano modificabili");
    } catch (e) {
      console.error(e);
      toast("Salvataggio non riuscito: " + e.message);
    } finally { setSalvando(false); }
  }

  function scarica(blob, nome) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  if (stato === "carico") return (
    <div className="carico"><div className="barra"><i></i></div><div>Apro il modulo</div></div>
  );
  if (stato === "errore") return (
    <div className="colonna">
      <div className="testa"><button className="icona-btn" onClick={onEsci}>‹</button><h1>Errore</h1></div>
      <div className="corpo"><div className="avviso">Non riesco a leggere questo PDF. Se è protetto da password, rimuovila prima di aprirlo qui.</div></div>
    </div>
  );

  const campoScelto = campi.find((c) => c.id === scelto) || null;
  const diPagina = campi.filter((c) => c.pagina === pagina);
  const compilati = diPagina.filter((c) => c.firmaId || (c.tipo === "check" ? c.valore : !!c.valore)).length;

  return (
    <div className="colonna">
      <div className="testa">
        <button className="icona-btn" onClick={onEsci}>‹</button>
        <h1>{file.name}<span className="sotto">{compilati} di {diPagina.length} campi in questa pagina</span></h1>
        <button className={"icona-btn" + (modoAgg ? " scelto" : "")}
          style={modoAgg ? {background: "var(--evidenziatore)", color: "#1a1200"} : null}
          onClick={() => setModoAgg((v) => !v)} title="Aggiungi campo">＋</button>
      </div>

      <div className="scena">
        {jsDoc.current && (
          <Pagina key={pagina} jsDoc={jsDoc.current} numero={pagina} campi={diPagina}
            scelto={scelto} onScegli={setScelto} onSposta={aggiorna} onNuovo={nuovoCampo}
            modoAgg={modoAgg} firme={firme} onPronta={paginaPronta} />
        )}
      </div>

      <div className="piedi">
        <button className="icona-btn" disabled={pagina === 0}
          onClick={() => { setScelto(null); setPagina((p) => p - 1); }}>‹</button>
        <span className="conta">Pagina {pagina + 1} di {nPagine}</span>
        <button className="icona-btn" disabled={pagina >= nPagine - 1}
          onClick={() => { setScelto(null); setPagina((p) => p + 1); }}>›</button>
        <button className="salva" disabled={salvando} onClick={salva}>{salvando ? "Salvo…" : "Salva PDF"}</button>
      </div>

      {campoScelto && (
        <FoglioCampo campo={campoScelto} anagrafica={anagrafica} firme={firme}
          onChiudi={() => setScelto(null)} onAggiorna={aggiorna} onElimina={elimina} />
      )}
    </div>
  );
}

/* ============================ firme ============================ */

function TelaFirma({onSalva, onAnnulla}) {
  const tela = useRef(null);
  const disegna = useRef(false);
  const vuota = useRef(true);
  const [nome, setNome] = useState("");

  useEffect(() => {
    const c = tela.current;
    const r = c.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    c.width = r.width * dpr; c.height = r.height * dpr;
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#111d2e";
  }, []);

  const punto = (e) => {
    const r = tela.current.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  };
  const giu = (e) => {
    e.preventDefault();
    tela.current.setPointerCapture(e.pointerId);
    const ctx = tela.current.getContext("2d");
    const p = punto(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    disegna.current = true; vuota.current = false;
  };
  const muovi = (e) => {
    if (!disegna.current) return;
    e.preventDefault();
    const ctx = tela.current.getContext("2d");
    const p = punto(e);
    ctx.lineTo(p.x, p.y); ctx.stroke();
  };
  const su = () => { disegna.current = false; };

  const pulisci = () => {
    const c = tela.current;
    c.getContext("2d").clearRect(0, 0, c.width, c.height);
    vuota.current = true;
  };

  const ritaglia = () => {
    const c = tela.current;
    const ctx = c.getContext("2d");
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0, trovato = false;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] > 16) {
          trovato = true;
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (!trovato) return null;
    const m = 6;
    x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
    x1 = Math.min(c.width - 1, x1 + m); y1 = Math.min(c.height - 1, y1 + m);
    const t = document.createElement("canvas");
    t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
    t.getContext("2d").drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
    return t.toDataURL("image/png");
  };

  return (
    <div className="corpo">
      <p className="sommario">Firma con il dito. Lo sfondo resta trasparente e il tratto viene ritagliato.</p>
      <canvas className="tela" ref={tela}
        onPointerDown={giu} onPointerMove={muovi} onPointerUp={su} onPointerCancel={su}></canvas>
      <span className="etichetta">Nome della firma</span>
      <input className="campo-testo" value={nome} onChange={(e) => setNome(e.target.value)}
        placeholder="Es. firma completa, sigla" />
      <div className="righe">
        <button className="btn" onClick={pulisci}>Cancella</button>
        <button className="btn" onClick={onAnnulla}>Annulla</button>
        <button className="btn primario" onClick={() => {
          const png = ritaglia();
          if (!png) return;
          onSalva({id: nuovoId(), nome: nome.trim() || "Firma", png, creata: Date.now()});
        }}>Salva firma</button>
      </div>
    </div>
  );
}

function Firme({firme, onCambia, onEsci, toast}) {
  const [nuova, setNuova] = useState(false);

  const salva = async (f) => {
    const lista = firme.concat(f);
    if (lista.length === 1) f.predefinita = true;
    await idbSalva("firme", f);
    onCambia(lista);
    setNuova(false);
    toast("Firma salvata");
  };
  const elimina = async (id) => {
    await idbElimina("firme", id);
    onCambia(firme.filter((f) => f.id !== id));
  };
  const predefinita = async (id) => {
    const lista = firme.map((f) => ({...f, predefinita: f.id === id}));
    for (const f of lista) await idbSalva("firme", f);
    onCambia(lista);
  };

  return (
    <div className="colonna">
      <div className="testa">
        <button className="icona-btn" onClick={() => (nuova ? setNuova(false) : onEsci())}>‹</button>
        <h1>Firme</h1>
        {!nuova && <button className="icona-btn" onClick={() => setNuova(true)}>＋</button>}
      </div>
      {nuova ? <TelaFirma onSalva={salva} onAnnulla={() => setNuova(false)} /> : (
        <div className="corpo">
          {firme.length === 0 && <p className="sommario">Nessuna firma salvata. Creane una e la ritrovi in ogni modulo.</p>}
          <div className="griglia">
            {firme.map((f) => (
              <div key={f.id} className={"scheda" + (f.predefinita ? " predef" : "")}>
                <div className="anteprima"><img src={f.png} alt={f.nome} /></div>
                <div className="riga">
                  <span style={{flex: 1}}>{f.nome}</span>
                </div>
                <div className="riga">
                  <button onClick={() => predefinita(f.id)}>{f.predefinita ? "Predefinita" : "Rendi predefinita"}</button>
                  <button onClick={() => elimina(f.id)}>Elimina</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================ anagrafica ============================ */

function Anagrafica({anagrafica, onCambia, onEsci, toast}) {
  const [val, setVal] = useState(anagrafica);
  const salva = async () => {
    for (const c of CAMPI_ANAGRAFICA) {
      await idbSalva("anagrafica", {chiave: c.chiave, valore: val[c.chiave] || ""});
    }
    onCambia(val);
    toast("Dati salvati");
    onEsci();
  };
  return (
    <div className="colonna">
      <div className="testa">
        <button className="icona-btn" onClick={onEsci}>‹</button>
        <h1>I tuoi dati</h1>
      </div>
      <div className="corpo">
        <p className="sommario">Compilati una volta, riconosciuti automaticamente nei moduli con campi e richiamabili con un tap negli altri.</p>
        {CAMPI_ANAGRAFICA.map((c) => (
          <div key={c.chiave}>
            <span className="etichetta">{c.etichetta}</span>
            <input className="campo-testo" value={val[c.chiave] || ""}
              placeholder={c.auto ? dataOggi() + " (automatica)" : ""}
              onChange={(e) => setVal({...val, [c.chiave]: e.target.value})} />
          </div>
        ))}
        <div style={{height: 18}}></div>
        <button className="azione" onClick={salva}>Salva</button>
      </div>
    </div>
  );
}

/* ============================ app ============================ */

function App() {
  const [schermata, setSchermata] = useState("home");
  const [file, setFile] = useState(null);
  const [anagrafica, setAnagrafica] = useState({});
  const [firme, setFirme] = useState([]);
  const [msg, setMsg] = useState("");
  const [moduli, setModuli] = useState([]);
  const input = useRef(null);

  const toast = useCallback((t) => {
    setMsg(t);
    setTimeout(() => setMsg((m) => (m === t ? "" : m)), 3200);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const a = await idbTutti("anagrafica");
        const o = {};
        a.forEach((r) => { o[r.chiave] = r.valore; });
        setAnagrafica(o);
        setFirme(await idbTutti("firme"));
        const l = await idbTutti("layout");
        setModuli(l.sort((x, y) => y.aggiornato - x.aggiornato).slice(0, 6));
      } catch (e) { console.warn(e); }
    })();
  }, [schermata]);

  const apri = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setFile(f);
    setSchermata("editor");
    e.target.value = "";
  };

  let vista;
  if (schermata === "editor" && file) {
    vista = <Editor file={file} anagrafica={anagrafica} firme={firme}
      onEsci={() => { setFile(null); setSchermata("home"); }} toast={toast} />;
  } else if (schermata === "anagrafica") {
    vista = <Anagrafica anagrafica={anagrafica} onCambia={setAnagrafica}
      onEsci={() => setSchermata("home")} toast={toast} />;
  } else if (schermata === "firme") {
    vista = <Firme firme={firme} onCambia={setFirme} onEsci={() => setSchermata("home")} toast={toast} />;
  } else {
    vista = (
      <div className="colonna">
        <div className="corpo">
          <h1 className="titolone">Moduli PDF,<br />compilati dal telefono</h1>
          <p className="sommario">Apri un modulo, tocca dove serve, firma e rimandalo indietro. Tutto resta sul dispositivo.</p>
          <button className="azione" onClick={() => input.current.click()}>Apri un PDF</button>
          <input ref={input} type="file" accept="application/pdf,.pdf" hidden onChange={apri} />

          <div className="gruppo">
            <h2>Cosa riuso ogni volta</h2>
            <button className="voce" onClick={() => setSchermata("anagrafica")}>
              <span className="eti"><b>I tuoi dati</b>
                <span>{Object.values(anagrafica).filter(Boolean).length} voci compilate</span></span>
              <span className="freccia">›</span>
            </button>
            <button className="voce" onClick={() => setSchermata("firme")}>
              <span className="eti"><b>Firme</b>
                <span>{firme.length === 0 ? "nessuna, creane una" : firme.length + " salvate"}</span></span>
              <span className="freccia">›</span>
            </button>
          </div>

          {moduli.length > 0 && (
            <div className="gruppo">
              <h2>Moduli già mappati</h2>
              {moduli.map((m) => (
                <div key={m.impronta} className="voce">
                  <span className="eti"><b>{m.nome}</b>
                    <span>{m.campi.length} campi memorizzati</span></span>
                </div>
              ))}
              <p className="sommario" style={{marginTop: 12, fontSize: 13}}>
                Riaprendo uno di questi, i campi tornano al loro posto senza rilevarli di nuovo.
              </p>
            </div>
          )}
        </div>
      </div>
    );
  }

  return <>{vista}{msg && <div className="toast">{msg}</div>}</>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("sw", e));
  });
}
</script>
</body>
</html>
